<meta name="description" content="633 commits, 251 active days, The Night Owl. Made with commit-wrapped.">
<style>
:root {
  color-scheme: dark;
  --dur: 6.5s;
  --bg: linear-gradient(150deg, #2e1065, #7c3aed 45%, #db2777);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: #07060d;
  color: #fff;
  font-family: ui-sans-serif, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';
  display: grid;
  place-items: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.backdrop {
  position: fixed;
  inset: -20%;
  background: var(--bg);
  filter: blur(90px) saturate(1.2);
  opacity: .4;
  transition: background 1s;
}

#story {
  position: relative;
  width: min(100vw, calc(100dvh * 9 / 16), 480px);
  height: min(100dvh, 860px);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 40px 120px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06);
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  isolation: isolate;
}
@media (max-width: 520px) {
  #story { width: 100vw; height: 100dvh; border-radius: 0; }
}

/* progress */
.bars { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 4px; z-index: 5; }
.bar { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #fff; }
.bar.done i { width: 100%; }
.bar.active i { animation: fill var(--dur) linear forwards; }
.paused .bar.active i { animation-play-state: paused; }
@keyframes fill { to { width: 100%; } }

.top {
  position: absolute; top: 28px; left: 18px; right: 12px; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; font-weight: 800; letter-spacing: .02em;
}
.top span { opacity: .9; }
.icon-btn {
  appearance: none; border: 0; background: rgba(255, 255, 255, .14); color: #fff;
  width: 34px; height: 34px; border-radius: 50%; font-size: 13px; cursor: pointer;
  display: grid; place-items: center;
}
.icon-btn:hover { background: rgba(255, 255, 255, .24); }

/* slides */
.slide {
  position: absolute; inset: 0;
  padding: 92px 30px 48px;
  display: flex; flex-direction: column; justify-content: center; gap: 14px;
  opacity: 0; visibility: hidden;
  transition: opacity .45s, visibility .45s;
  overflow: hidden;
}
.slide.active { opacity: 1; visibility: visible; }
.slide > * { position: relative; }
.blob {
  position: absolute !important; border-radius: 50%; filter: blur(4px); opacity: .55; pointer-events: none;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 65%);
  animation: float 9s ease-in-out infinite alternate;
}
.blob.a { width: 340px; height: 340px; top: -110px; right: -120px; }
.blob.b { width: 260px; height: 260px; bottom: -90px; left: -100px; animation-delay: -4s; opacity: .35; }
@keyframes float { to { transform: translate(-30px, 40px) scale(1.08); } }

.g1 { background: linear-gradient(150deg, #2e1065, #7c3aed 45%, #db2777); }
.g2 { background: linear-gradient(160deg, #052e16, #15803d 50%, #a3e635); }
.g3 { background: linear-gradient(150deg, #7c2d12, #ea580c 50%, #facc15); }
.g4 { background: linear-gradient(160deg, #0c1445, #1d4ed8 50%, #22d3ee); }
.g5 { background: linear-gradient(150deg, #111827, #4338ca 55%, #a855f7); }
.g6 { background: linear-gradient(150deg, #831843, #e11d48 50%, #fb923c); }
.g7 { background: linear-gradient(160deg, #042f2e, #0f766e 50%, #38bdf8); }
.g8 { background: linear-gradient(150deg, #1e1b4b, #a21caf 55%, #f472b6); }
.g9 { background: linear-gradient(160deg, #18181b, #3f3f46 50%, #a1a1aa); }

.kicker { font-size: 14px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
h1 { font-size: clamp(46px, 13vw, 68px); font-weight: 900; line-height: .98; letter-spacing: -.035em; }
h2 { font-size: clamp(32px, 9vw, 46px); font-weight: 850; line-height: 1.04; letter-spacing: -.025em; }
.mega { font-size: clamp(76px, 23vw, 120px); font-weight: 900; line-height: .9; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.mega.mid { font-size: clamp(56px, 16vw, 84px); }
.unit { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.lead { font-size: 19px; line-height: 1.45; opacity: .93; }
.lead b { font-weight: 850; }
.hint { font-size: 14px; opacity: .7; margin-top: 18px; }
code.file {

.anim { opacity: 0; }
.active .anim { animation: rise .8s cubic-bezier(.2, .8, .2, 1) var(--d, 0s) both; }

.art {
  display: block; align-self: flex-start; flex-shrink: 1;
  height: clamp(96px, 22vh, 190px); min-height: 72px; width: auto; aspect-ratio: 1;
  object-fit: cover; border-radius: 26px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .14);
}
.art.sm { height: clamp(80px, 15vh, 130px); min-height: 64px; }
.art.big { height: clamp(150px, 32vh, 280px); }
.art.hero { height: clamp(170px, 36vh, 320px); border-radius: 32px; }
.chip img { width: 22px; height: 22px; border-radius: 7px; vertical-align: -6px; margin-right: 4px; }

/* hours */
.hours { display: flex; align-items: flex-end; gap: 3px; height: 150px; margin-top: 10px; }
.hours i { flex: 1; height: var(--h); min-height: 3px; background: rgba(255, 255, 255, .42); border-radius: 4px 4px 2px 2px; transform-origin: bottom; }
.hours i.peak { background: #fff; box-shadow: 0 0 24px rgba(255, 255, 255, .7); }
.active .hours i { animation: grow .9s cubic-bezier(.2, .8, .2, 1) calc(.45s + var(--i) * 28ms) both; }
@keyframes grow { from { transform: scaleY(0); } }
.axis { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; opacity: .7; }

/* calendar */
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin-top: 14px; }
.heat i { aspect-ratio: 1; border-radius: 2px; background: rgba(255, 255, 255, .13); }
.heat i.l1 { background: rgba(255, 255, 255, .35); }
.heat i.l2 { background: rgba(255, 255, 255, .55); }
.heat i.l3 { background: rgba(255, 255, 255, .8); }
.heat i.l4 { background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .6); }
.heat i.x { visibility: hidden; }
.heat i.f { opacity: .35; }
.active .heat i { animation: dot .45s ease calc(.35s + var(--w) * 16ms) both; }
@keyframes dot { from { opacity: 0; transform: scale(.2); } }

/* languages */
.langs { list-style: none; padding: 0; display: grid; gap: 14px; margin-top: 8px; }
.langs li { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-weight: 800; font-size: 18px; }
.langs .track { grid-column: 1 / -1; height: 10px; border-radius: 10px; background: rgba(255, 255, 255, .18); overflow: hidden; }
.langs .track i { display: block; height: 100%; width: var(--w); background: var(--c); border-radius: 10px; transform-origin: left; box-shadow: 0 0 0 1px rgba(255, 255, 255, .25) inset; }
.active .langs .track i { animation: growx 1.1s cubic-bezier(.2, .8, .2, 1) calc(.45s + var(--i) * 120ms) both; }

/* lists */
.list { list-style: none; padding: 0; display: grid; gap: 10px; }
.list li { display: flex; gap: 12px; align-items: baseline; font-size: 17px; line-height: 1.35; font-weight: 600; }
.list li .e { font-size: 22px; flex: none; width: 28px; text-align: center; }
.list li .n { margin-left: auto; font-weight: 850; font-variant-numeric: tabular-nums; }
.list.mono li span:not(.n) { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace; font-size: 14px; word-break: break-all; opacity: .9; }

.plus { color: #bbf7d0; }
.minus { color: #fecdd3; }

/* personality */
.big-emoji { font-size: clamp(96px, 30vw, 140px); line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: rgba(255, 255, 255, .16); font-weight: 750; font-size: 14px; }

/* share card */
.card { width: 100%; border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); display: block; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  appearance: none; border: 0; border-radius: 999px; padding: 13px 14px; font: inherit; font-weight: 850; font-size: 15px;
  background: #fff; color: #111; cursor: pointer; text-align: center; text-decoration: none;
  transition: transform .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: rgba(255, 255, 255, .16); color: #fff; }
.small { font-size: 13px; opacity: .75; text-align: center; }
.small a { color: inherit; font-weight: 800; }
.toast {
  position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 20px); z-index: 9;
  background: #fff; color: #111; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
  opacity: 0; transition: .3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* screenshots, reduced motion */
.static *, .static *::before { animation: none !important; transition: none !important; }
.static .anim { opacity: 1; }
.static .hint { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01s !important; animation-delay: 0s !important; }
  .bar.active i { animation: fill var(--dur) linear forwards !important; }
}

<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const params = new URLSearchParams(location.search);
  const isStatic = params.has('static');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const num = (n) => Number(n).toLocaleString('en-US');
  const pct = (x) => `${Math.round(x * 100)}%`;
  const count = (n) => `<span data-to="${n}">${num(n)}</span>`;
  const a = (d) => `style="--d:${d}s"`;
  const pic = (src, d = 0, size = '') => (src ? `<img class="art pop ${size}" style="--d:${d}s" src="${src}" alt="">` : '');
  const A = D.art || {};

  const slides = [];
  const add = (bg, html) => slides.push({ bg, html });

  add('g1', `
    ${pic(A.intro, 0.2, 'big')}
    <p ${a(0)} class="kicker anim">${D.year} Wrapped</p>
    <h1 class="anim" ${a(0.15)}>Hey ${esc(D.firstName)}.</h1>
    <p ${a(0.4)} class="lead anim">You wrote a lot of code this year.<br>Let's unwrap it.</p>
    <p ${a(1.2)} class="hint anim">Tap or press → to continue</p>`);

  add('g6', `
    <p ${a(0)} class="kicker anim">This year you made</p>
    <div ${a(0.15)} class="mega anim">${count(D.commits)}</div>
    <h2 class="anim" ${a(0.3)}>commits</h2>
    <p ${a(0.9)} class="lead anim">across <b>${num(D.activeDays)}</b> days${D.repos.length > 1 ? ` and <b>${D.repos.length}</b> repos` : ''}.
      That's <b>${D.perDay}</b> commits every day you showed up.</p>`);

  if (D.busiest) {
    add('g3', `
      ${pic(A.busiest, 0.9)}
      <p ${a(0)} class="kicker anim">Your busiest day was</p>
      <h2 class="anim" ${a(0.15)}>${esc(D.busiest.weekday)},<br>${esc(D.busiest.label)}</h2>
      <div ${a(0.5)} class="mega anim">${count(D.busiest.commits)}</div>
      <p ${a(0.65)} class="lead anim"><b>commits in a single day.</b><br>Whatever happened, we hope it shipped.</p>`);
  }

  const maxH = Math.max(...D.hours, 1);
  add('g4', `
    ${pic(A.hour, 0.2)}
    <p ${a(0)} class="kicker anim">You're most alive at</p>
    <div ${a(0.15)} class="mega anim">${esc(D.peakHour)}</div>
    <div class="hours">${D.hours.map((n, i) => `<i style="--h:${(n / maxH) * 100}%;--i:${i}"${i === D.peakHourIndex ? ' class="peak"' : ''} title="${n}"></i>`).join('')}</div>
    <div class="axis"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>11 PM</span></div>
    <p ${a(1.1)} class="lead anim">${esc(D.hourNote)} And <b>${esc(D.peakWeekday)}s</b> were your favorite day to ship.</p>`);

  if (D.streak.days > 1) {
    add('g2', `
      ${pic(A.streak, 0.2)}
      <p ${a(0)} class="kicker anim">Your longest streak</p>
      <div ${a(0.15)} class="mega anim">${count(D.streak.days)}<span class="unit"> days</span></div>
      <p ${a(0.35)} class="lead anim">${esc(D.streak.from)} → ${esc(D.streak.to)}, without missing a single day.</p>
      <div class="heat">${D.heat.map((week, w) => week.map((v) => `<i class="${v < 0 ? 'x' : v > 4 ? 'f' : `l${v}`}" style="--w:${w}"></i>`).join('')).join('')}</div>`);
  }

  if (D.languages.length) {
    const top = D.languages[0].share;
    add('g5', `
      ${pic(A.languages, 0.2, 'sm')}
      <p ${a(0)} class="kicker anim">You wrote code in</p>
      <h2 class="anim" ${a(0.15)}>${D.languageCount} language${D.languageCount === 1 ? '' : 's'}</h2>
      <ol class="langs">${D.languages.map((l, i) => `
        <li class="anim" ${a(0.3 + i * 0.12)}><span>${esc(l.name)}</span><span>${pct(l.share)}</span>
          <span class="track"><i style="--w:${(l.share / top) * 100}%;--c:${l.color};--i:${i}"></i></span></li>`).join('')}
      </ol>
      <p ${a(1.2)} class="lead anim">but <b>${esc(D.languages[0].name)}</b> was your mother tongue.</p>`);
  }

  add('g7', `
    ${pic(A.lines, 0.2)}
    <p ${a(0)} class="kicker anim">You added</p>
    <div ${a(0.15)} class="mega mid anim plus">+${count(D.added)}</div>
    <p ${a(0.45)} class="kicker anim">and deleted</p>
    <div ${a(0.6)} class="mega mid anim minus">−${count(D.deleted)}</div>
    <p ${a(1.1)} class="lead anim">lines of code. ${esc(D.linesQuip)}</p>`);

  if (D.topFile) {
    add('g8', `
      ${pic(A.file, 0.2, 'sm')}
      <p ${a(0)} class="kicker anim">The file you couldn't leave alone</p>
      <code ${a(0.15)} class="file anim">${esc(D.topFile.path)}</code>
      <p ${a(0.35)} class="lead anim">${D.repos.length > 1 ? `in <b>${esc(D.topFile.repo)}</b>, ` : ''}touched in <b>${num(D.topFile.commits)}</b> commits.</p>
      ${D.topFiles.length ? `<ol class="list mono">${D.topFiles.map((f, i) => `<li class="anim" ${a(0.7 + i * 0.1)}><span>${esc(f.path)}</span><span class="n">${num(f.commits)}</span></li>`).join('')}</ol>` : ''}`);
  }

  if (D.repos.length > 1) {
    add('g3', `
      ${pic(A.repos, 0.2)}
      <p ${a(0)} class="kicker anim">Where you spent your time</p>
      <h2 class="anim" ${a(0.15)}>${D.repos.length} repos</h2>
      <ol class="list">${D.repos.slice(0, 6).map((r, i) => `<li class="anim" ${a(0.35 + i * 0.1)}><span class="e">${['🥇', '🥈', '🥉'][i] ?? '·'}</span><span>${esc(r.name)}</span><span class="n">${num(r.commits)}</span></li>`).join('')}</ol>`);
  }

  if (D.ai.commits) {
    add('g9', `
      <p ${a(0)} class="kicker anim">Your pair programmer</p>
      ${A.ai ? pic(A.ai, 0.15, 'big') : `<div ${a(0.15)} class="big-emoji pop">🤖</div>`}
      <h2 class="anim" ${a(0.4)}>${count(D.ai.commits)} commits</h2>
      <p ${a(0.6)} class="lead anim">were co-authored by AI. That's <b>${pct(D.ai.share)}</b> of your year.
        ${D.ai.tools.length ? `Favorite co-pilot: <b>${esc(D.ai.tools[0].name)}</b>.` : ''}</p>`);
  }

  if (D.facts.length) {
    add('g6', `
      ${pic(A.facts, 0.2, 'sm')}
      <p ${a(0)} class="kicker anim">Things we noticed</p>
      <h2 class="anim" ${a(0.15)}>Fun facts</h2>
      <ul class="list">${D.facts.map((f, i) => `<li class="anim" ${a(0.35 + i * 0.15)}><span class="e">${f.emoji}</span><span>${esc(f.text)}</span></li>`).join('')}</ul>`);
  }

  const P = D.personality;
  add('g1', `
    <p ${a(0)} class="kicker anim">Your coding personality is</p>
    ${A.personality ? pic(A.personality, 0.7, 'hero') : `<div style="--d:.7s" class="big-emoji pop">${P.emoji}</div>`}
    <h1 class="anim" ${a(1.1)}>${esc(P.title)}</h1>
    <p ${a(1.3)} class="lead anim"><b>${esc(P.tagline)}</b> ${esc(P.description)}</p>
    ${P.traits.length ? `<div ${a(1.6)} class="chips anim">${P.traits.map((t) => `<span class="chip">${A.traits?.[t.id] ? `<img src="${A.traits[t.id]}" alt="">` : t.emoji} ${esc(t.title)}</span>`).join('')}</div>` : ''}`);

  const cardSrc = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(D.card)}`;
  const shareText = `My ${D.year} in code: ${num(D.commits)} commits, a ${D.streak.days}-day streak, and apparently I'm ${P.title} ${P.emoji}\n\nGet your own: ${D.command}`;
  add('g5', `
    <p ${a(0)} class="kicker anim">That's a wrap</p>
    <img ${a(0.15)} class="card anim" src="${cardSrc}" alt="${esc(D.firstName)}'s ${D.year} Wrapped card">
    <div ${a(0.35)} class="actions anim">
      <button class="btn" data-act="png">Download PNG</button>
      <button class="btn ghost" data-act="svg">Download SVG</button>
      <a class="btn ghost" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(shareText)}">Share on X</a>
      <button class="btn ghost" data-act="copy">Copy text</button>
    </div>
    <p ${a(0.6)} class="small anim">Made with <a href="${esc(D.repoUrl)}" target="_blank" rel="noopener">commit-wrapped</a>. Nothing left your machine.</p>`);

  // ---- mount
  const story = document.getElementById('story');
  story.innerHTML = `
    <div class="bars">${slides.map(() => '<div class="bar"><i></i></div>').join('')}</div>
    <div class="top"><span>✦ commit-wrapped</span><button class="icon-btn" data-act="pause" aria-label="Pause">❚❚</button></div>
    ${slides.map((s, i) => `<section class="slide ${s.bg}" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${slides.length}"><div class="blob a"></div><div class="blob b"></div>${s.html}</section>`).join('')}
    <div class="toast" role="status"></div>`;
  if (isStatic) document.body.classList.add('static');

  const els = [...story.querySelectorAll('.slide')];
  const bars = [...story.querySelectorAll('.bar')];
  const pauseBtn = story.querySelector('[data-act="pause"]');
  let current = 0;
  let paused = isStatic || params.has('noplay');

  function go(n) {
    n = Math.max(0, Math.min(els.length - 1, n));
    els[current].classList.remove('active');
    current = n;
    const el = els[current];
    void el.offsetWidth; // restart CSS animations on revisit
    el.classList.add('active');
    bars.forEach((b, i) => {
      b.classList.remove('active');
      b.classList.toggle('done', i < current || (i === current && current === els.length - 1));
    });
    if (current < els.length - 1) {
      void bars[current].offsetWidth;
      bars[current].classList.add('active');
    }
    document.documentElement.style.setProperty('--bg', getComputedStyle(el).backgroundImage);
    history.replaceState(null, '', `#${current + 1}`);
    countUp(el);
  }

  function countUp(el) {
    for (const node of el.querySelectorAll('[data-to]')) {
      const to = Number(node.dataset.to);
      if (isStatic || to < 10) continue;
      const delay = (parseFloat(node.closest('[style*="--d"]')?.style.getPropertyValue('--d')) || 0) * 1000;
      const start = performance.now() + delay;
      const tick = (now) => {
        const k = Math.min(1, Math.max(0, (now - start) / 1500));
        node.textContent = num(Math.round(to * (1 - Math.pow(1 - k, 3))));
        if (k < 1 && el.classList.contains('active')) requestAnimationFrame(tick);
        else node.textContent = num(to);
      };
      node.textContent = '0';
      requestAnimationFrame(tick);
    }
  }

  function setPaused(p) {
    paused = p;
    story.classList.toggle('paused', p);
    pauseBtn.textContent = p ? '▶' : '❚❚';
    pauseBtn.setAttribute('aria-label', p ? 'Play' : 'Pause');
  }

  function toast(msg) {
    const t = story.querySelector('.toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function save(blob, name) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }

  async function act(kind) {
    if (kind === 'pause') return setPaused(!paused);
    if (kind === 'svg') return save(new Blob([D.card], { type: 'image/svg+xml' }), `commit-wrapped-${D.year}.svg`);
    if (kind === 'copy') {
      await navigator.clipboard.writeText(shareText).then(() => toast('Copied!'), () => toast('Copy failed'));
      return;
    }
    if (kind === 'png') {
      const img = new Image();
      img.src = cardSrc;
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = 2400;
      canvas.height = 1260;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((b) => save(b, `commit-wrapped-${D.year}.png`), 'image/png');
    }
  }

  bars.forEach((b) => b.addEventListener('animationend', () => go(current + 1)));
  story.addEventListener('click', (e) => {
    const control = e.target.closest('button, a');
    if (control) {
      if (control.dataset.act) act(control.dataset.act);
      return;
    }
    const { left, width } = story.getBoundingClientRect();
    go(e.clientX - left < width * 0.3 ? current - 1 : current + 1);
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(current + 1);
    else if (e.key === 'ArrowLeft') go(current - 1);
    else if (e.key === ' ') {
      e.preventDefault();
      setPaused(!paused);
    }
  });

  setPaused(paused);
  const start = Number((location.hash.match(/^#(\d+)$/) || [])[1]) || 1;
  go(start - 1);
})();

</script>
</body>
</html>
